[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["patches/xnu-12377/soc/**"]
inputs = ["8 cores: cpu0-2 A510, cpu3-4 A715, cpu5-6 A710, cpu7 X3; MPIDR Aff1 0x000-0x700; PSCI smc.", "GICv3 GICD 0x17100000, GICR 0x17180000 stride 0x40000 (sm8550.dtsi); arch timer 19.2 MHz, EL1 virtual timer PPI 11 = INTID 27."]
configuration = ["dts/ishtar.dts: unixnu,cluster-type E for cpu0-2, P for cpu3-7.", "patches/xnu-12377/soc/native-smp-secondary.patch: start.s masks MPIDR with 0xFFFF on BCM2837; sheng-platform-power.patch unchanged."]
procedure = ["Boot with -v and check all eight CPUs check in and the timer interrupt fires."]
findings = ["The 12377 arch layer already sets MAX_CPUS 8 for BCM2837, so only the start.s hunk of sm8550-common's 11215 patch is needed.", "Old port: ABL/UEFI leave SPIs enabled and pending; the iOS 18 kernel needed them disabled before interrupts (old 2005). sheng boots on the same SoC with ArmCpu, so this is checked, not ported.", "Old port: a wrong virtual-timer INTID (19) stopped all timer interrupts; SM8550 uses INTID 27."]
completion = ["8/8 CPUs online, timer and IPIs working, AMP clusters reported as E and P."]
limits = ["Not built or booted on ishtar."]
next_action = ["Record the first stage 0 boot log for CPU bring-up and interrupts."]

