revision = "14f1a2831b12e7c85ae3626401754bec599005a2"
result = "2026-10-29: status resolves (16 components with dependencies, 75 patches); defconfig written; 75/75 patches apply on xnu-12377.121.6."

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/dtb2dts.py"]
inputs = ["../uefi-ishtar: Mu-Silicium fork of wh1stl3/uefi-nuwa with ishtarPkg (not on the current build machine).", "Stock DTB/DTBO: AOSPA android_device_xiaomi_ishtar-kernel vauxite bd593b3 dtbs/kalama-v2.dtb + dtbo.img entry 06 (msm-id 0x207 rev 2, board-id 0x10008, xiaomi,miboard-id 5)."]
configuration = ["firmware.config = ishtar; dsc = Platforms/Xiaomi/ishtarPkg/ishtar.dsc; ENABLE_SECUREBOOT = 0; no Mu patches (sheng's Gic-Spurious.patch belongs to uefi-sheng).", "bootimg.image header_version 1, pagesize 4096; bootimg.dtb_node splash_region 0xb8000000+0x2b00000."]
procedure = ["Add UniXNURamDiskDxe, UniXNUDxe, DiskIoDxe and FAT to uefi-ishtar (https://unixnu.com/porting/uefi-firmware#required-integration); its UniXNU menu and DarwinBoot already run.", "./unixnu build firmware -D ../UniXNU-ishtar --uefi ../uefi-ishtar; ./unixnu bootimg ... --dtb <stock kalama-v2.dtb>.", "Decompile stock trees with scripts/dtb2dts.py (no dtc needed): dtbo.img --list, --entry 6."]
findings = ["Old port: uefipil.cfg needed #ABL in [AUTO] and the DXE heap at 0xBAE00000+0x0D1C0000 (sheng's size) to reach the UniXNU menu; ADSP is started by UEFI ([AUTO] FULL_ADSP).", "The 16 KiB-page iOS 18 kernel needed DarwinBoot to place kernels on 32 MiB boundaries (old uefi/darwinboot-32mb-block.patch); the arm64e profile is 4 KiB-page, so that patch is not carried.", "AOSPA's dtbo.img holds all SM8550 Xiaomi boards; ishtar entries are 06-08, sheng 50-52. Entry 06 matches this unit (msm 0x207 v2, miboard 5)."]
completion = ["uefi-ishtar builds with the payload RAM disk, lists the iOS 27 entry and hands the GOP framebuffer and memory map to DarwinBoot."]
limits = ["uefi-ishtar and the stock firmware dump are not on the build machine used for this record.", "proprietary-files.txt has no active entries yet."]
next_action = ["Integrate UniXNURamDiskDxe in uefi-ishtar and record its commit and the handoff memory map."]

