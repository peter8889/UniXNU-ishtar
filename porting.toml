schema_version = 1

[device]
name = "ishtar"
soc = "SM8550"
os_profile = "ios-27.0.1-24A446"
summary = "Xiaomi 13 Ultra (SM8550-AB) runs iOS 27.0.1 24A446 as an iPhone 16 Pro Max (iPhone17,2, D94AP) on UniXNU's xnu-12377 kernel, reusing shared SM8550 and sheng iPadOS 27 support. Hardware facts and device results of the earlier iOS 18 port (markakash/UniXNU-ishtar 79ddf457) are cited where they carry over; nothing in this repository has booted yet."

[[area]]
id = "configuration"
status = "host-verified"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", ".github/**", ".gitignore", "local.toml.example", "unixnu/**"]
inputs = ["UniXNU branch ishtar/ios27 = feat/ipados27-gpu-parity 1cff985 + unixnu/0001-profiles-ios-27.0.1-24A446-iPhone17-2-D94AP.patch (profile ios-27.0.1-24A446).", "UniXNU-sm8550-common 23b2049 (feeds.toml), the pin of sheng's feat/ipados27-gpu-parity 0dac77e.", "iPhone17,2 iOS 27.0.1 24A446 IPSW; xnu-12377.121.6 (ac9718fb) public source."]
configuration = ["board.os_profile = ios-27.0.1-24A446; board.soc_source = sm8550; board.kit = sheng (UniXNU build-sheng-source-storage.py and build-arm-driver.py read board sources from kits/sheng).", "kernel.defconfig = ishtar_ios27_defconfig (stage 0: CONFIG_XNU_NATIVE_LEGACY_DISPLAY=n, CONFIG_XNU_NATIVE_ADRENO=n); config_fragments = arch common + os ios.config (no SoC fragment, as sheng's iPadOS 27 board).", "kernel.patch_series = arch, device:patches/xnu-12377/soc/series, os, device:patches/xnu-12377/series."]
procedure = ["cd ../UniXNU && git switch ishtar/ios27 (or git am ../UniXNU-ishtar/unixnu/*.patch on feat/ipados27-gpu-parity).", "Copy local.toml.example to local.toml when the SoC checkout is local; otherwise ./unixnu fetch -D ../UniXNU-ishtar.", "~/miniconda3/bin/python3 ./unixnu defconfig ishtar_ios27_defconfig -D ../UniXNU-ishtar, then ./unixnu status --json -D ../UniXNU-ishtar."]
findings = ["The resolver reads only UniXNU/profiles/os, so an OS profile cannot live in a device repository; the iOS profile is a UniXNU commit carried here as a patch.", "Every iOS 27.0.1 iPhone and iPad ships build 24A446, so the iPad profile's kernel source, Darwin 26 patches and OS series apply unchanged to the iPhone profile.", "UniXNU's CLI needs Python 3.11+ (tomllib); macOS /usr/bin/python3 is 3.9.", "unixnu/0002 adds the ported AMFI init address and abi/original-classes.json to the profile; regenerate both patches with git format-patch -2 on ishtar/ios27 after any profile change."]
completion = ["status resolves arch arm64e, SoC, ios-27.0.1-24A446 and this board; defconfig writes out/ishtar/ios-27.0.1-24A446/ishtar_ios27/.config; the patch order applies."]
limits = ["The UniXNU branch ishtar/ios27 is local; publish it or apply unixnu/*.patch on another machine.", "Component revisions come from the UniXNU catalog of that branch; driver feat/ipados27-gpu-parity branches are not pinned separately."]
next_action = ["Publish the UniXNU profile branch, then run ./unixnu fetch to write unixnu.lock."]

