[[area]]
id = "memory"
status = "implemented"
components = []
paths = ["dts/**"]
inputs = ["12 GB LPDDR5X; largest contiguous run 0x8c0000000-0xaffffefff (9 GiB, HyperOS /proc/iomem).", "Stock reserved memory equals nuwa's (37 regions); splash_region 0xb8000000+0x2b00000."]
configuration = ["dts/ishtar.dts memory@80000000 2 GiB (nominal, as sheng); payload.dram_size 0x80000000.", "payload.adt.owned_memory_size 0x130000000 (sheng's window); kern.maxvnodes 78848 for it."]
procedure = ["Read DarwinBoot's window base and size from the boot log; compare with the UEFI memory map."]
findings = ["DarwinBoot owns one contiguous window of owned_memory_size (256 MiB-8 GiB) from the UEFI map; the DTS range is nominal.", "Old port booted with an 8 GiB window; a 3 GiB window starved its 1.5 GB GPU buffer pool. UniXNU's A740 now allocates BOs from system memory, so sheng's 4.75 GiB window is the starting point."]
completion = ["The ADT reports the owned window, the splash region stays reserved, and no allocation fails at boot."]
limits = ["The 8 GiB window is untested with the arm64e kernel."]
next_action = ["After stage 0 boots, try owned_memory_size 0x200000000 and recompute kern.maxvnodes."]

[[area.evidence]]
kind = "source"
reference = "dts/ishtar.dts"
result = "Memory, reserved splash region and cluster topology for ishtar."

[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["package/Source*.cpp"]
inputs = ["UFS 4.0 ufshc@1d84000, PHY 0x1d80000; userdata = LUN 0 GPT entry (sda30), first block 0x2f3040 (4 KiB), 229483 MiB.", "iPhone17,2 OS and Cryptex1,SystemOS images (AEA) and their root policies."]
configuration = ["CONFIG_XNU_SOURCE_STORAGE=y with package/SourceStorage.cpp, SourceRootPolicies.cpp, SourceRootBinding.cpp (copied from sheng 0dac77e); policy tables in userdata.", "Kernel args native-source-storage=1 native-ufs-root=1; install entry sheng-data-reset=1/2 (ShengUfs names).", "board.toml userdata first_lba 3092544, last_lba 61840191."]
procedure = ["Confirm userdata geometry: adb shell cat /sys/block/sda/sda30/start /sys/block/sda/sda30/size (512-byte sectors).", "Decrypt the iPhone17,2 OS and SystemOS images, fill the profile [root] UUIDs and digests, build the policies and the Data seed, set CONFIG_XNU_OWNER_DATA_VOLUME_UUID.", "Write the userdata windows (this erases Android userdata)."]
findings = ["ShengUfs finds userdata through the LUN 0 GPT and already sends START STOP UNIT to the device W-LUN, the step the old ishtar port needed after UEFI (old 2008).", "Old port: UFS reads and writes worked from XNU with SM8550 GCC offsets from Linux gcc-sm8550.c (old 2002)."]
completion = ["The OS and SystemOS windows mount, the Data volume mounts read-write and launchd starts."]
limits = ["last_lba is derived from a MiB count (may be up to 255 blocks short).", "Profile [root] values and the Data volume UUID are REQUIRED placeholders; AEA decryption needs the ipsw tool."]
next_action = ["Measure userdata geometry on the phone and decrypt the two iPhone17,2 images."]

