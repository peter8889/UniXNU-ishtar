"include_dirs" = ["soc:dts"]


["components"]
"include" = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "ShengUfs",
  "Adreno740",
  "XnuPrelink",
  "DarwinBoot",
