"schema_version" = 2

["board"]
"name" = "ishtar"
"soc" = "SM8550"
"description" = "Xiaomi 13 Ultra"
"kit" = "sheng"
"soc_source" = "sm8550"
"os_profile" = "ipados-17.7.11-21H461"


["userdata"]
"first_lba" = 3094592
"last_lba" = 64007162
"lba_bytes" = 4096
"windows" = [{ "name" = "OS", "component" = "OS" }, { "name" = "SystemOS", "component" = "Cryptex1,SystemOS" }]


["kernel"]
"defconfig" = "gpu_defconfig"
"archives" = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  "fetch-adreno-inputs.py",
  "fetch-sheng-dts.py",
  "prepare-sheng-gmu.py",
  "prepare-sheng-gmu-votes.py",
  "prepare-sheng-command-db-oracle.py",
  "derive-a740-hwinit.py",
  "derive-a740-pwrup.py",
  "component:Adreno740",
  "build-adreno740-kits.py",
  "build-adreno-link-stubs.py",
  # build-adreno740-accelerator.py needs drivers/AdrenoMetal/OriginalAcceleratorABI.h (payload-stage AdrenoMetal
  # component); the kernel link has no accelerator archive variable, so it is not part of the kernel build.
]
"config_fragments" = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
"patch_series" = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]


["firmware"]
"config" = "ishtar"
"dsc" = "Platforms/Xiaomi/ishtarPkg/ishtar.dsc"
"fd" = "Build/ishtarPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
"preflight" = []
"submodules" = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
"patches" = ["Resources/MuPatches/Gic-Spurious.patch"]
"packages" = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

["firmware"."defines"]
"ENABLE_SECUREBOOT" = "1"
"DEVICE_MODEL" = "ishtar"
"MEMORY_PROTECTION" = "TRUE"
"SHIP_MODE" = "FALSE"
"BUILDID_STRING" = "ishtar-research"



["payload"]
"volume" = "ISHTARESP"
"size_mib" = 54
"loader" = "firmware"
"title" = "Boot iPadOS"
"dram_size" = "0x200000000"
"panic_screen" = true
"panic_framebuffer" = { base = "0xb8000000", width = 1440, height = 3200, stride = 5760 }
"kernel_args" = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-unit-scale=2", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-hid-home=1", "offline-hid-input=1", "offline-legacy-phase=4", "offline-mobile-graphics-client=1", "offline-mobile-graphics-load=1", "offline-apfs-load=1", "boot-progress=2", "-apfs_shared_datavolume", "offline-key-events=1", "sheng-disable-watchdogd=1", "sheng-lite=1", "boot-ui-focus4=SpringBoard", "sheng-smp=1", "sheng-cpufreq=3", "sheng-gpu-power=9", "sheng-gpu-metal=1", "sheng-banner=0", "sheng-gpu-perf=8", "armcpu-spi-ipi=1", "-no_slto_panic", "ml-timeout-lock-panic-scale=40", "sheng-touch-hid=1"]


