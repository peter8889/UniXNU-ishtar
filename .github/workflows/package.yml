name: package

# scripts/package.sh 在 macOS runner 上跑：UniXNU 与本仓库的 uefi-sheng 检出放在 board.toml 指定的兄弟目录。
# 平台种子来自仓库 secret UNIXNU_UNIQUE_CHIP_ID，会被烘进镜像，所以产物只属于一台设备：下载后请删除该次运行。

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: string
        default: "ipados-17.7.11-21H461"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: peter8889/uefi-sheng
          path: uefi-sheng
      # audit-adreno-platform.py 用 __file__.parents[2] 定位 ROOT；CI 里 kits/sheng 是指向
      # device/package 的符号链接，ROOT 会落在 workdir（checkout 的上一层），所以把 pins 放过去。
      # audit-adreno-platform.py 的 ROOT 是 __file__.parents[2]；CI 里 kits/sheng 指向
      # device/package，所以 ROOT 正好落在 GITHUB_WORKSPACE，pins 必须放在这里。
      - name: adreno pins
        run: |
          mkdir -p "$GITHUB_WORKSPACE/docs"
          cp device/docs/adreno-inputs.json "$GITHUB_WORKSPACE/docs/adreno-inputs.json"
          ls -l "$GITHUB_WORKSPACE/docs/"
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{16}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 16 hex digits.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-sheng
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-ishtar
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/ishtar/*/*/boot/boot.img
            UniXNU/out/ishtar/*/*/payload/payload.img
            UniXNU/out/ishtar/*/*/kernel/kernel.macho
            UniXNU/out/ishtar/*/*/package.manifest.json
